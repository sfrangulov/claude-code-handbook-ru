name: Link Check

on:
  schedule:
    # Каждый понедельник в 09:00 UTC (12:00 МСК)
    - cron: '0 9 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'catalog/**.md'
      - 'examples/**/*.md'
      - '.github/workflows/link-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3.14

      - name: Check README
        id: check-readme
        continue-on-error: true
        run: |
          markdown-link-check -c .github/markdown-link-check.json README.md > /tmp/readme.log 2>&1
          cat /tmp/readme.log

      - name: Check catalog
        id: check-catalog
        continue-on-error: true
        run: |
          set +e
          find catalog -name '*.md' -print0 | xargs -0 -n1 markdown-link-check -c .github/markdown-link-check.json > /tmp/catalog.log 2>&1
          cat /tmp/catalog.log

      - name: Collect dead links
        id: collect
        run: |
          DATE=$(date -u +%Y-%m-%d)
          {
            echo "## Dead links report (${DATE})"
            echo
            echo "### README.md"
            echo '```'
            grep -E '^\s*✖' /tmp/readme.log || echo '(нет)'
            echo '```'
            echo
            echo "### catalog/"
            echo '```'
            grep -E '^\s*✖' /tmp/catalog.log || echo '(нет)'
            echo '```'
          } > /tmp/report.md
          DEAD_COUNT=$(grep -cE '^\s*✖' /tmp/readme.log /tmp/catalog.log 2>/dev/null | awk -F: '{s+=$2} END {print s+0}')
          echo "dead_count=${DEAD_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Open issue if dead links found
        if: steps.collect.outputs.dead_count != '0' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          DEAD_COUNT: ${{ steps.collect.outputs.dead_count }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/report.md', 'utf8');
            const dead = process.env.DEAD_COUNT;
            const date = new Date().toISOString().slice(0,10);
            const body = report + '\n\n_Сгенерировано автоматически workflow `link-check.yml`._';
            const title = `🔗 Dead links report (${date}) — ${dead} broken`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['dead-link', 'maintenance'],
            });

      - name: Fail PR check if dead links
        if: steps.collect.outputs.dead_count != '0' && github.event_name == 'pull_request'
        env:
          DEAD_COUNT: ${{ steps.collect.outputs.dead_count }}
        run: |
          echo "::error::Found ${DEAD_COUNT} dead links. See logs above."
          exit 1
