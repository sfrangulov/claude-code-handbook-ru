name: Link Check

on:
  schedule:
    # Каждый понедельник в 09:00 UTC (12:00 МСК)
    - cron: '0 9 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'catalog/**.md'
      - 'examples/**/*.md'
      - '.github/workflows/link-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3.14

      - name: Check README
        id: check-readme
        continue-on-error: true
        run: |
          markdown-link-check -c .github/markdown-link-check.json README.md > /tmp/readme.log 2>&1
          cat /tmp/readme.log

      - name: Check catalog
        id: check-catalog
        continue-on-error: true
        run: |
          set +e
          find catalog -name '*.md' -print0 | xargs -0 -n1 markdown-link-check -c .github/markdown-link-check.json > /tmp/catalog.log 2>&1
          cat /tmp/catalog.log

      # Метаданные видят то, что markdown-link-check пропускает по устройству:
      # переименование отдаёт 301, архив и заброшенность — честные 200.
      # На PR не гоняем: полторы тысячи репозиториев это лишняя минута и шум
      # в чужом пул-реквесте.
      - name: Check repo metadata
        id: repos
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # scope=curated: два запроса вместо двух десятков. Полный каталог
          # ловил вторичный лимит GitHub, а строгие правила и так применяются
          # только к курируемой подборке.
          node scripts/check-repos.mjs --scope=curated --markdown > /tmp/repos.md 2>/tmp/repos.err
          CODE=$?
          cat /tmp/repos.err
          # Сводку — в лог шага: иначе по зелёному статусу не понять,
          # проверил он полторы сотни репозиториев или ноль.
          head -4 /tmp/repos.md
          # Коды выхода: 0 — чисто, 1 — есть находки, 2 — скрипт упал,
          # 3 — часть репозиториев проверить не удалось.
          echo "repo_exit=${CODE}"
          echo "repo_exit=${CODE}" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "2" ]; then
            {
              echo "### Метаданные репозиториев"
              echo
              echo "> ❌ Проверка не отработала — отчёта нет. Ошибка:"
              echo '```'
              tail -5 /tmp/repos.err
              echo '```'
            } > /tmp/repos.md
          fi
          # Строки таблицы ошибок: всё, что не заглушка "| — | — | (нет) | — |".
          ERR=$(sed -n '/^\*\*Ошибки\*\*/,/^\*\*Предупреждения\*\*/p' /tmp/repos.md \
                | grep -cE '^\| `' || true)
          echo "repo_errors=${ERR}"
          echo "repo_errors=${ERR}" >> "$GITHUB_OUTPUT"

      - name: Collect dead links
        id: collect
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # markdown-link-check печатает мёртвую ссылку как "  [✖] <url> → Status: <code>".
          # Считаем только строки со Status, иначе каждая ссылка попадёт в счёт дважды:
          # один раз в потоковом выводе и второй — в итоговом списке "ERROR: N dead links found!".
          PATTERN='\[✖\].*→ Status:'
          {
            echo "## Dead links report (${DATE})"
            echo
            echo "### README.md"
            echo '```'
            grep -E "$PATTERN" /tmp/readme.log || echo '(нет)'
            echo '```'
            echo
            echo "### catalog/"
            echo '```'
            grep -E "$PATTERN" /tmp/catalog.log || echo '(нет)'
            echo '```'
            if [ -s /tmp/repos.md ]; then
              echo
              cat /tmp/repos.md
            fi
          } > /tmp/report.md
          DEAD_COUNT=$(cat /tmp/readme.log /tmp/catalog.log 2>/dev/null | grep -cE "$PATTERN" || true)
          echo "dead_count=${DEAD_COUNT}"
          echo "dead_count=${DEAD_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Open issue if dead links found
        if: (steps.collect.outputs.dead_count != '0' || steps.repos.outputs.repo_exit != '0') && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          DEAD_COUNT: ${{ steps.collect.outputs.dead_count }}
          REPO_ERRORS: ${{ steps.repos.outputs.repo_errors }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/report.md', 'utf8');
            const dead = process.env.DEAD_COUNT;
            const repoErrors = process.env.REPO_ERRORS || '0';
            const date = new Date().toISOString().slice(0,10);
            const body = report + '\n\n_Сгенерировано автоматически workflow `link-check.yml`._';
            const title = `🔗 Health report (${date}) — ${dead} мёртвых ссылок, ${repoErrors} по метаданным`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['dead-link', 'maintenance'],
            });

      - name: Fail PR check if dead links
        if: steps.collect.outputs.dead_count != '0' && github.event_name == 'pull_request'
        env:
          DEAD_COUNT: ${{ steps.collect.outputs.dead_count }}
        run: |
          echo "::error::Found ${DEAD_COUNT} dead links. See logs above."
          exit 1
