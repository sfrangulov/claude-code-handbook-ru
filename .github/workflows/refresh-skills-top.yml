name: Refresh top-15 skills

# Weekly job: pull fresh install counts from skills.sh, regenerate README,
# open a PR if anything changed. Manual run via workflow_dispatch.
#
# Security note: no untrusted event input is interpolated into run: commands.

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday at 06:00 UTC (09:00 МСК)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-skills-top
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Pull fresh install counts from skills.sh
        run: node scripts/refresh-top-skills.mjs --write

      - name: Regenerate README.md
        run: node scripts/build-readme.mjs

      - name: Validate + lint data
        run: |
          node scripts/validate-data.mjs
          node scripts/lint-data.mjs --warn

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(skills): refresh top-15 from skills.sh'
          title: 'chore(skills): refresh top-15 from skills.sh'
          body: |
            Automated weekly refresh of `data/skills-top.json` and `README.md`.

            Pipeline:
            1. `node scripts/refresh-top-skills.mjs --write`
            2. `node scripts/build-readme.mjs`
            3. `node scripts/validate-data.mjs` + `lint-data.mjs --warn`

            If the diff looks wrong (zero entries, slugs renamed unexpectedly,
            descriptions reset to placeholder), do NOT merge — investigate
            skills.sh upstream first. New entries land with the placeholder
            description and need a human review pass before merging.
          branch: chore/refresh-top-skills
          delete-branch: true
          labels: |
            automated
            skills
