name: Auto-regenerate docs on main

# Safety net: if a PR is merged with stale generated *.md (contributor forgot
# to run build-readme.mjs locally and bypassed the PR --check gate),
# regenerate every README.md + catalog/*.md and commit back as
# github-actions[bot]. Path filter excludes generated *.md so the bot commit
# does not re-trigger this workflow.
#
# Security note: workflow does not interpolate any untrusted event payload
# into run: commands. Only repo-controlled files and built-in env vars used.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'README.template.md'
      - 'catalog/**.template.md'
      - 'scripts/build-readme.mjs'
      - '.github/workflows/readme-auto-regen.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-auto-regen
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate docs from templates
        run: node scripts/build-readme.mjs

      - name: Commit and push if any generated *.md changed
        run: |
          if git diff --quiet README.md catalog/; then
            echo "All generated docs are already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md catalog/*.md
          git commit -m "chore(docs): auto-regenerate from data/templates"
          git push
