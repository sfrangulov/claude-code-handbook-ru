name: README generation gate

on:
  pull_request:
    paths:
      - 'data/**'
      - 'README.template.md'
      - 'README.md'
      - 'scripts/build-readme.mjs'
      - '.github/workflows/readme-gen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify README.md is in sync with template + data
        run: node scripts/build-readme.mjs --check
